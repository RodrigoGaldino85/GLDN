  const [err, setErr] = React.useState('');
  const submit = e => { e.preventDefault(); if (!/.+@.+\..+/.test(email)) { setErr('Informe um e-mail corporativo válido'); return; } setSent(true); };
  const info = [['mail', 'contato@gldn.tech'], ['map-pin', 'São Paulo · Atendimento em todo o Brasil'], ['clock', 'Resposta em até 1 dia útil']];
  return (
    <Section glow={<><Glow x="85%" y="30%" size={1000} /><Glow x="0%" y="90%" size={700} color="rgba(212,175,55,.10)" /></>}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,400px),1fr))', gap: 64, alignItems: 'start' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 40 }}>
          <CH as="h1" size="lg" eyebrow="Contato" title="Vamos conversar" highlight="sobre o seu momento." lead="Conte onde sua empresa está com IA. Em até um dia útil, um especialista retorna com os próximos passos." />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
            {info.map(([i, t]) => <div key={t} style={{ display: 'flex', gap: 14, alignItems: 'center', fontSize: 15, color: 'var(--text-strong)' }}><CIcon name={i} size={20} color="var(--accent)" />{t}</div>)}
          </div>
        </div>
        <CGlass glow padding="clamp(24px,4vw,44px)" radius={20}>
          {sent ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 24, alignItems: 'flex-start', padding: '24px 0' }}>
              <div style={{ width: 56, height: 56, borderRadius: '50%', border: '1px solid var(--border-accent-strong)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><CIcon name="check" size={26} color="var(--accent)" /></div>
              <CH size="sm" title="Mensagem recebida." highlight="Falamos em breve." lead={'Enviamos uma confirmação para ' + email + '.'} />
              <CBtn variant="secondary" onClick={() => { setSent(false); go('home'); }}>Voltar ao início</CBtn>
            </div>
          ) : (
            <form onSubmit={submit} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 22 }}>
              <Input label="Nome" placeholder="Seu nome" required />
              <Input label="E-mail corporativo" type="email" placeholder="voce@empresa.com.br" value={email} onChange={e => { setEmail(e.target.value); setErr(''); }} error={err} required />
              <Input label="Empresa" placeholder="Nome da empresa" />
              <Select label="Colaboradores" placeholder="Selecione" options={['1–50', '51–500', '501–5.000', '5.000+']} />
              <Select label="Interesse" placeholder="Selecione" options={['Copilot para Microsoft 365', 'Copilot Studio & agentes', 'Governança de IA', 'Capacitação']} style={{ gridColumn: '1 / -1' }} />
              <Textarea label="Mensagem" rows={4} placeholder="Qual processo você quer acelerar com IA?" style={{ gridColumn: '1 / -1' }} />
              <Checkbox defaultChecked label="Aceito receber comunicações da GLDN Tech." style={{ gridColumn: '1 / -1' }} />
              <div style={{ gridColumn: '1 / -1' }}><CBtn type="submit" size="lg" fullWidth iconRight="arrow-right">Enviar mensagem</CBtn></div>
            </form>
          )}
        </CGlass>
      </div>
    </Section>
  );
}
Object.assign(window, { ContactPage });

</script>
<script type="text/babel">
const { NavBar } = window.GLDNTechDesignSystem_247012;
const PAGES = { home: HomePage, solucoes: SolutionsPage, capacitacao: TrainingPage, contato: ContactPage };
const LINKS = [['Soluções', 'solucoes'], ['Capacitação', 'capacitacao'], ['Contato', 'contato']];
function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('gldn-kit-page') || 'home');
  const go = p => { setPage(p); localStorage.setItem('gldn-kit-page', p); window.scrollTo(0, 0); };
  const Page = PAGES[page] || HomePage;
  return <>
    <NavBar links={LINKS.map(([l, p]) => ({ label: l, active: p === page, page: p }))} onNavigate={i => go(i.page)} onLogo={() => go('home')} cta="Agendar diagnóstico" onCta={() => go('contato')} />
    <main data-screen-label={page}><Page go={go} /></main>
    <Footer go={go} />
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
