<!-- @dsCard group="Colors" viewport="700x200" name="Semantic surfaces & text" subtitle="Aliases — use these in UI, not raw scales" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="height:70px;border-radius:10px;background:var(--bg-page);border:1px solid var(--border-subtle);padding:10px;font:500 11px var(--font-body);color:var(--text-muted)">bg-page</div><div style="height:70px;border-radius:10px;background:var(--bg-raised);border:1px solid var(--border-subtle);padding:10px;font:500 11px var(--font-body);color:var(--text-muted)">bg-raised</div><div style="height:70px;border-radius:10px;background:var(--surface-card);border:1px solid var(--border-subtle);padding:10px;font:500 11px var(--font-body);color:var(--text-muted)">surface-card</div><div style="height:70px;border-radius:10px;background:var(--surface-accent);border:1px solid var(--border-subtle);padding:10px;font:500 11px var(--font-body);color:var(--text-muted)">surface-accent</div></div><div style="display:flex;gap:28px;margin-top:18px;font:400 15px var(--font-body)"><span style="color:var(--text-strong)">text-strong</span><span style="color:var(--text-body)">text-body</span><span style="color:var(--text-muted)">text-muted</span><span style="color:var(--text-faint)">text-faint</span><span style="color:var(--text-accent)">text-accent</span></div><div style="display:flex;gap:10px;margin-top:16px"><div style="flex:1;height:30px;border-radius:8px;border:1px solid var(--border-subtle);font:400 10.5px var(--font-body);color:var(--text-muted);display:flex;align-items:center;justify-content:center">border-subtle</div><div style="flex:1;height:30px;border-radius:8px;border:1px solid var(--border-default);font:400 10.5px var(--font-body);color:var(--text-muted);display:flex;align-items:center;justify-content:center">border-default</div><div style="flex:1;height:30px;border-radius:8px;border:1px solid var(--border-accent);font:400 10.5px var(--font-body);color:var(--text-muted);display:flex;align-items:center;justify-content:center">border-accent</div><div style="flex:1;height:30px;border-radius:8px;border:1px solid var(--border-accent-strong);font:400 10.5px var(--font-body);color:var(--text-muted);display:flex;align-items:center;justify-content:center">border-accent-strong</div></div></body></html>
