<!-- @dsCard group="Colors" viewport="700x170" name="Gradients & glows" subtitle="Metallic gold for rules/numerals; ember glow for backgrounds" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px"><div><div style="height:90px;border-radius:10px;background:var(--gradient-gold);border:1px solid var(--border-subtle)"></div><div style="font:400 10.5px var(--font-body);color:var(--text-muted);margin-top:6px">gold</div></div><div><div style="height:90px;border-radius:10px;background:var(--gradient-gold-metal);border:1px solid var(--border-subtle)"></div><div style="font:400 10.5px var(--font-body);color:var(--text-muted);margin-top:6px">gold-metal</div></div><div><div style="height:90px;border-radius:10px;background:var(--gradient-black-metal);border:1px solid var(--border-subtle)"></div><div style="font:400 10.5px var(--font-body);color:var(--text-muted);margin-top:6px">black-metal</div></div><div><div style="height:90px;border-radius:10px;background:var(--glow-ember) center/140% 160% no-repeat,var(--bg-page);border:1px solid var(--border-subtle)"></div><div style="font:400 10.5px var(--font-body);color:var(--text-muted);margin-top:6px">glow-ember</div></div></div></body></html>
