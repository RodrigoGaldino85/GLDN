<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Sparingly — dots, validation, badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:var(--status-success);border:1px solid var(--border-subtle)"></div><div style="font:500 11px var(--font-body);color:var(--text-strong)">success</div><div style="font:400 10.5px var(--font-body);color:var(--text-muted)">#4CAF7A</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:var(--status-danger);border:1px solid var(--border-subtle)"></div><div style="font:500 11px var(--font-body);color:var(--text-strong)">danger</div><div style="font:400 10.5px var(--font-body);color:var(--text-muted)">#D05A4E</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:var(--status-info);border:1px solid var(--border-subtle)"></div><div style="font:500 11px var(--font-body);color:var(--text-strong)">info</div><div style="font:400 10.5px var(--font-body);color:var(--text-muted)">#7C9BD1</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:var(--status-warning);border:1px solid var(--border-subtle)"></div><div style="font:500 11px var(--font-body);color:var(--text-strong)">warning</div><div style="font:400 10.5px var(--font-body);color:var(--text-muted)">#D4AF37</div></div></div></body></html>
